name: Publish PyPI

on:
  release:
    types:
      - published

permissions: {}

concurrency:
  group: production-publication
  queue: max

jobs:
  build:
    name: Formal Package Build
    uses: ./.github/workflows/package-build.yml
    permissions:
      contents: read
    with:
      mode: formal

  pypi:
    name: Publish PyPI
    needs:
      - build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/project/comfyui-docker-helper/${{ needs.build.outputs.version }}/
    permissions:
      # Required for PyPI Trusted Publishing OIDC.
      id-token: write
    steps:
      - name: Download formal distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.build.outputs.artifact-name }}
          path: dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
          skip-existing: false
