[compute_platform]
type = "cuda"

[compute_platform.cuda]
version = "13.0.3"
image_flavor = "cudnn-devel"
image_distro = "ubuntu24.04"

[pytorch]
version = "2.12.1"

[cdh]
default_downloader = "aria2"
default_download_mode = "sync"

[cdh.downloader.aria2]
rpc_port = 6811
split = 1
max_connection_per_server = 1
min_split_size = "1M"
resume_download = true

[comfyui]
version = "latest"
install_manager = false
listen = "0.0.0.0"
port = 8188
extra_args = []

[[files]]
url = "https://raw.githubusercontent.com/pythongosssss/ComfyUI-Custom-Scripts/609f3afaa74b2f88ef9ce8d939626065e3247469/README.md"
dir = "models/cdh-smoke"
filename = "aria2-readme.md"
overwrite = true
downloader = "aria2"
download_mode = "sync"
