name: Publish PyPI

on:
  release:
    types:
      - published

permissions: {}

concurrency:
  group: production-publication
  queue: max

jobs:
  build:
    name: Formal Package Build
    uses: ./.github/workflows/package-build.yml
    permissions:
      contents: read
    with:
      mode: formal

  pypi:
    name: Publish PyPI
    needs:
      - build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/project/comfyui-docker-helper/${{ needs.build.outputs.version }}/
    permissions:
      # Required for PyPI Trusted Publishing OIDC.
      id-token: write
    steps:
      - name: Download formal distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.build.outputs.artifact-name }}
          path: dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/
          skip-existing: false
