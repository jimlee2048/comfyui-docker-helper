name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.32"
          python-version: "3.12"
      - name: Synchronize locked environment
        run: uv sync --locked --all-groups
      - name: Check formatting
        run: uv run --locked ruff format --check .
      - name: Lint
        run: uv run --locked ruff check .

  test:
    name: Test / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.12"
          - "3.13"
          - "3.14"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.32"
          python-version: ${{ matrix.python-version }}
      - name: Synchronize locked environment
        run: uv sync --locked --all-groups
      - name: Run default-offline tests
        run: uv run --locked pytest

  windows_host:
    name: Windows host / Python 3.12
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.32"
          python-version: "3.12"
      - name: Synchronize locked environment
        run: uv sync --locked --all-groups
      - name: Import root CLI
        run: uv run --locked python -c "import comfyui_docker_helper.cli"
      - name: Verify Windows platform boundary
        run: >-
          uv run --locked pytest
          tests/integration/test_windows_host_boundary.py
      - name: Verify Windows security primitives
        run: >-
          uv run --locked pytest
          tests/unit/test_file_admission.py
          tests/unit/test_private_state.py
          tests/integration/test_windows_file_primitives.py
          tests/integration/test_windows_private_state.py
          tests/integration/test_descriptor_lock.py
      - name: Verify Windows Secret and hook workflows
        run: >-
          uv run --locked pytest
          tests/integration/test_windows_host_secret_session.py
          tests/integration/test_windows_hook_inputs.py
      - name: Verify Windows rendering
        run: >-
          uv run --locked pytest
          tests/integration/test_windows_rendering.py
      - name: Verify Windows external host integrations
        run: >-
          uv run --locked pytest
          tests/integration/test_host_git_credential.py
          tests/integration/test_windows_buildx_adapter.py
          tests/unit/test_host_secret_session.py::test_windows_git_binding_quotes_unicode_python_path
          tests/integration/test_cli.py::test_build_ssh_on_windows_delegates_default_agent_to_buildkit
          tests/unit/test_uv_docker_executor.py::test_requirements_compile_uses_one_exact_owned_container
          tests/unit/test_uv_docker_executor.py::test_controlled_input_copy_failure_cleans_private_state_and_container
      - name: Exercise root version
        run: uv run --locked cdh --version
      - name: Exercise root help
        run: uv run --locked cdh --help
      - name: Exercise host help
        run: uv run --locked cdh host --help
      - name: Exercise host validation
        run: uv run --locked cdh host validate -f examples/minimal.toml
      - name: Exercise container boundary help
        run: uv run --locked cdh container --help

  package:
    name: Package
    uses: ./.github/workflows/package-build.yml
    permissions:
      contents: read
    with:
      mode: source

  required:
    name: CI / Required
    if: ${{ always() }}
    needs:
      - lint
      - test
      - package
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every CI gate
        env:
          LINT_RESULT: ${{ needs.lint.result }}
          TEST_RESULT: ${{ needs.test.result }}
          PACKAGE_RESULT: ${{ needs.package.result }}
        run: |
          test "$LINT_RESULT" = "success"
          test "$TEST_RESULT" = "success"
          test "$PACKAGE_RESULT" = "success"
