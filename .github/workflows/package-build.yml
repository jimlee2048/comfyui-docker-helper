name: Package Build

on:
  push:
    tags:
      - "v*"
  workflow_call:
    inputs:
      mode:
        description: Run as an untagged source check or a formal release build.
        required: true
        type: string
    outputs:
      artifact-name:
        description: Exact same-run artifact name, or an empty string.
        value: ${{ jobs.package.outputs.artifact-name }}
      version:
        description: Normalized package version read from the checked-out source.
        value: ${{ jobs.package.outputs.version }}

permissions: {}

jobs:
  package:
    name: Build and qualify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      artifact-name: ${{ steps.admission.outputs.artifact_name }}
      version: ${{ steps.admission.outputs.version }}
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.32"
          python-version: "3.12"
          enable-cache: false
      - name: Synchronize locked environment
        run: uv sync --locked --all-groups
      - name: Admit source and package identity
        id: admission
        env:
          EVENT_ACTION: ${{ github.event.action }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_MODE: ${{ inputs.mode }}
          REF_NAME: ${{ github.ref_name }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: uv run --locked tools/ci/admit_package_build.py
      - name: Build distributions through the sdist
        env:
          DIST_DIR: ${{ runner.temp }}/cdh-dist
        run: |
          test ! -e "$DIST_DIR"
          uv build \
            --no-sources \
            --force-pep517 \
            --no-create-gitignore \
            --out-dir "$DIST_DIR"
      - name: Verify distribution identities and archives
        env:
          DIST_DIR: ${{ runner.temp }}/cdh-dist
        run: uv run --locked tools/ci/verify_distributions.py
      - name: Check distribution metadata
        env:
          DIST_DIR: ${{ runner.temp }}/cdh-dist
        run: |
          shopt -s nullglob
          artifacts=("$DIST_DIR"/*)
          test "${#artifacts[@]}" -eq 2
          uv run --locked twine check --strict "${artifacts[@]}"
      - name: Clean-install and exercise the wheel
        env:
          DIST_DIR: ${{ runner.temp }}/cdh-dist
          RUNTIME_REQUIREMENTS: ${{ runner.temp }}/runtime-requirements.txt
          WHEEL_VENV: ${{ runner.temp }}/cdh-wheel-venv
        run: |
          shopt -s nullglob
          wheels=("$DIST_DIR"/*.whl)
          test "${#wheels[@]}" -eq 1
          uv export --locked --no-dev --no-emit-project \
            --output-file "$RUNTIME_REQUIREMENTS"
          uv venv --python "3.12" "$WHEEL_VENV"
          uv pip install --python "$WHEEL_VENV/bin/python" --require-hashes \
            --requirements "$RUNTIME_REQUIREMENTS"
          uv pip install --python "$WHEEL_VENV/bin/python" --no-deps "${wheels[0]}"
          uv pip check --python "$WHEEL_VENV/bin/python"
          expected_version="$(
            uv run --locked python -c \
              'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])'
          )"
          installed_version="$(
            "$WHEEL_VENV/bin/python" -c \
              'from importlib.metadata import version; print(version("comfyui-docker-helper"))'
          )"
          test "$installed_version" = "$expected_version"
          test "$("$WHEEL_VENV/bin/cdh" --version)" = "cdh $expected_version"
          "$WHEEL_VENV/bin/python" -c 'import comfyui_docker_helper'
          "$WHEEL_VENV/bin/cdh" --help >/dev/null
          "$WHEEL_VENV/bin/cdh" host validate -f examples/minimal.toml
      - name: Verify installed canonical wheel byte identity
        env:
          DIST_DIR: ${{ runner.temp }}/cdh-dist
          WHEEL_VENV: ${{ runner.temp }}/cdh-wheel-venv
        run: |
          "$WHEEL_VENV/bin/python" - <<'PY'
          import hashlib
          import os
          from pathlib import Path

          from comfyui_docker_helper.host.release_wheel import build_canonical_wheel

          candidates = tuple(Path(os.environ["DIST_DIR"]).glob("*.whl"))
          if len(candidates) != 1:
              raise SystemExit("candidate wheel set is invalid")
          candidate = candidates[0]
          content = candidate.read_bytes()
          rebuilt = build_canonical_wheel()
          if (
              rebuilt.filename != candidate.name
              or rebuilt.digest != f"sha256:{hashlib.sha256(content).hexdigest()}"
              or rebuilt.content != content
          ):
              raise SystemExit("installed canonical wheel differs from candidate")
          PY
      - name: Record distribution digests
        env:
          DIST_DIR: ${{ runner.temp }}/cdh-dist
        run: sha256sum "$DIST_DIR"/*
      - name: Upload retained distributions
        if: ${{ steps.admission.outputs.artifact_name != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.admission.outputs.artifact_name }}
          path: ${{ runner.temp }}/cdh-dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
