name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.32"
          python-version: "3.12"
      - name: Synchronize locked environment
        run: uv sync --locked --all-groups
      - name: Check formatting
        run: uv run --locked ruff format --check .
      - name: Lint
        run: uv run --locked ruff check .

  test:
    name: Test / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.12"
          - "3.13"
          - "3.14"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.32"
          python-version: ${{ matrix.python-version }}
      - name: Synchronize locked environment
        run: uv sync --locked --all-groups
      - name: Run default-offline tests
        run: uv run --locked pytest

  windows_host:
    name: Windows diagnostic / ${{ matrix.slice }}
    runs-on: windows-latest
    timeout-minutes: 12
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - slice: unit-00-07
            python-version: "3.12"
            skip: 0
          - slice: unit-08-15
            python-version: "3.12"
            skip: 8
          - slice: unit-16-23
            python-version: "3.12"
            skip: 16
          - slice: unit-24-29
            python-version: "3.12"
            skip: 24
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.32"
          python-version: ${{ matrix.python-version }}
      - name: Synchronize locked environment
        run: uv sync --locked --all-groups
      - name: Run Windows host and shared contracts
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $testFiles = @(
            Get-ChildItem -LiteralPath tests/unit/host -Filter "test_*.py" -File |
              Where-Object { $_.Name -ne "test_imports.py" } |
              Sort-Object -Property Name
          )
          $selectedFiles = @($testFiles | Select-Object -Skip ${{ matrix.skip }} -First 8)
          if ($selectedFiles.Count -eq 0) {
            throw "diagnostic slice selected no test files"
          }
          $pytestArgs = @(
            "-vv",
            "--tb=short",
            "--durations=50",
            "-o", "faulthandler_timeout=120",
            "-o", "faulthandler_exit_on_timeout=true"
          )
          $pytestArgs += $selectedFiles.FullName
          uv run --locked pytest @pytestArgs
      - name: Build Windows wheel
        if: ${{ matrix.slice == 'unit-rest' }}
        env:
          DIST_DIR: ${{ runner.temp }}\cdh-wheel-dist
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          if (Test-Path -LiteralPath $env:DIST_DIR) {
            throw "wheel output directory already exists"
          }
          uv build --wheel --no-sources --force-pep517 --no-create-gitignore --out-dir $env:DIST_DIR
          $wheels = @(Get-ChildItem -LiteralPath $env:DIST_DIR -Filter *.whl -File)
          if ($wheels.Count -ne 1) {
            throw "wheel build did not produce exactly one wheel"
          }
      - name: Clean-install and exercise Windows wheel
        if: ${{ matrix.slice == 'unit-rest' }}
        env:
          DIST_DIR: ${{ runner.temp }}\cdh-wheel-dist
          RUNTIME_REQUIREMENTS: ${{ runner.temp }}\runtime-requirements.txt
          WHEEL_VENV: ${{ runner.temp }}\cdh-wheel-venv
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $wheels = @(Get-ChildItem -LiteralPath $env:DIST_DIR -Filter *.whl -File)
          if ($wheels.Count -ne 1) {
            throw "wheel set is not exactly one wheel"
          }
          uv export --locked --no-dev --no-emit-project --output-file $env:RUNTIME_REQUIREMENTS
          uv venv --python "${{ matrix.python-version }}" $env:WHEEL_VENV
          $wheelPython = Join-Path $env:WHEEL_VENV "Scripts\python.exe"
          $wheelCdh = Join-Path $env:WHEEL_VENV "Scripts\cdh.exe"
          uv pip install --python $wheelPython --require-hashes --requirements $env:RUNTIME_REQUIREMENTS
          uv pip install --python $wheelPython --no-deps $wheels[0].FullName
          uv pip check --python $wheelPython
          $expectedVersion = uv run --locked python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])"
          if ((& $wheelCdh --version) -ne "cdh $expectedVersion") {
            throw "installed wheel version differs from project version"
          }
          & $wheelCdh --help | Out-Null
          & $wheelCdh host --help | Out-Null
          & $wheelCdh host validate -f examples/minimal.toml
          & $wheelCdh container --help | Out-Null

  package:
    name: Package
    uses: ./.github/workflows/package-build.yml
    permissions:
      contents: read
    with:
      mode: source

  required:
    name: CI / Required
    if: ${{ always() }}
    needs:
      - lint
      - test
      - windows_host
      - package
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every CI gate
        env:
          LINT_RESULT: ${{ needs.lint.result }}
          TEST_RESULT: ${{ needs.test.result }}
          WINDOWS_HOST_RESULT: ${{ needs.windows_host.result }}
          PACKAGE_RESULT: ${{ needs.package.result }}
        run: |
          test "$LINT_RESULT" = "success"
          test "$TEST_RESULT" = "success"
          test "$WINDOWS_HOST_RESULT" = "success"
          test "$PACKAGE_RESULT" = "success"
