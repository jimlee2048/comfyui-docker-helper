[compute_platform]
type = "cuda"

[compute_platform.cuda]
version = "13.0.3"
image_flavor = "cudnn-devel"
image_distro = "ubuntu24.04"

[pytorch]
version = "2.12.1"

[comfyui]
version = "0.11.0"
install_cli = false
install_manager = false
listen = "0.0.0.0"
port = 8188
extra_args = []

[[comfyui.custom_nodes]]
type = "git"
url = "https://github.com/pythongosssss/ComfyUI-Custom-Scripts.git"
ref = "609f3afaa74b2f88ef9ce8d939626065e3247469"
target_dir = "git-hook-probe"
pre_clone_hooks = ["git-pre-clone.py"]
pre_install_hooks = ["git-pre-install.py"]
post_install_hooks = ["git-post-install.py"]
