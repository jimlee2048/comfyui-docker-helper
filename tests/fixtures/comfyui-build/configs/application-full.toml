[compute_platform]
type = "cuda"

[compute_platform.cuda]
version = "13.0.3"
image_flavor = "cudnn-devel"
image_distro = "ubuntu24.04"

[pytorch]
version = "2.12.1"

[system.env]
CDH_SSH_FORMAL_SENTINEL = "cdh-py313-full-formal"
CDH_SSH_OVERRIDE_SENTINEL = "cdh-image-default"

[comfyui]
version = "0.11.0"
install_manager = true
listen = "0.0.0.0"
port = 8188
extra_args = []

[[comfyui.custom_nodes]]
type = "git"
url = "https://github.com/pythongosssss/ComfyUI-Custom-Scripts.git"
ref = "609f3afaa74b2f88ef9ce8d939626065e3247469"
target_dir = "git-custom-scripts"
pre_install_hooks = ["pre.sh", "pre.py"]
post_install_hooks = ["post.sh", "post.py"]

[[comfyui.custom_nodes]]
type = "registry"
id = "comfyui-custom-scripts"
version = "1.2.5"

[[comfyui.custom_nodes]]
type = "git"
url = "https://github.com/receyuki/comfyui-prompt-reader-node.git"
ref = "a70cbb0c8d1208a01c0eea72e8f2c3668cac3ba7"
target_dir = "comfyui-prompt-reader-node"
