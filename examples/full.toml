# Complete annotated ComfyUI Docker Helper configuration.
# Copy this file and remove fields you do not need. Fields not shown in
# minimal.toml usually have defaults, but they are included here for reference.

[compute_platform]
# Required. Supported: "cuda".
type = "cuda"

[compute_platform.cuda]
# Required. Numeric CUDA version used in the nvidia/cuda base image tag.
version = "13.0.3"

[system]
# Default: "/workspace". Must be an absolute POSIX container path.
workspace = "/workspace"
# Default: workspace + "/ComfyUI". Must be absolute and must not equal workspace.
comfyui_path = "/workspace/ComfyUI"
# Extra apt packages installed after the default OS package set.
extra_packages = ["ffmpeg", "libgl1"]

[system.env]
# Values become Dockerfile ENV entries and may appear in image history/logs.
# Do not put secrets here unless that exposure is acceptable.
COMFYUI_PORT = "8188"
EXAMPLE_PROFILE = "full"

[system.ssh]
# Default: false. Enable at runtime with SSH_ENABLE=true when SSH access is
# required. Host keys are generated when the container starts.
enable = false
# Default: 22. Override with SSH_PORT at container startup.
port = 22
# Leave empty in image config. SSH_PASSWORD can set a runtime-only root password.
password = ""
# Public keys must be single OpenSSH authorized_keys lines. SSH_PUB_KEY can
# append one runtime-only public key.
pub_keys = []

[python]
# Default: "3.13.14". Must be an exact stable CPython patch.
version = "3.13.14"
# Default: "0.11.28". Used as the locked ghcr.io/astral-sh/uv image tag.
uv_version = "0.11.28"
# Default: "https://pypi.org/simple". Used by cdh-controlled Python package
# installation steps.
index_url = "https://pypi.org/simple"
# Extra Python packages installed into the final virtualenv after PyTorch.
extra_packages = ["numpy"]
# Standalone CLI distributions installed into isolated uv tool environments.
# Direct URL, VCS, local, editable, marker, and raw uv argument forms are rejected.
uv_tools = ["ruff==0.15.18"]

[pytorch]
# Required. Installs torch==version from the CUDA wheel index inferred from CUDA.
# The lock and image retain the resolver's complete exact version, including
# the derived local channel label (for example, torch==2.12.1+cu130).
version = "2.12.1"
# Default: "https://download.pytorch.org/whl". Combined with the CUDA wheel tag.
index_base_url = "https://download.pytorch.org/whl"
# Additional PyTorch-family packages installed and constrained with torch as
# one exact group. Every direct member uses the derived PyTorch source; generic
# transitive dependencies use [python].index_url. Do not include "torch" here.
extra_packages = ["torchvision==0.27.1"]

[cdh]
# Default: "aria2". Supported: "aria2", "httpx".
# Per-file downloader values override this default.
default_downloader = "aria2"
# Default: "sync". Supported: "sync", "async".
# Per-file download_mode values override this default.
default_download_mode = "sync"
# Default: 3. Total attempts per file for each host build or container start.
download_max_attempts = 3
# Host build default: "fail". Runtime default: "continue".
# Supported: "continue", "fail".
download_failure_policy = "fail"

[cdh.downloader.httpx]
# Default: 60. Seconds for each HTTPX request attempt.
timeout = 60
# Default: 3. Number of retry attempts for HTTPX downloads.
retries = 3

[cdh.downloader.aria2]
# Default: 6800. Container-local aria2 RPC port used during file downloads.
rpc_port = 6800
# Default: 16. aria2 split count.
split = 16
# Default: 16. aria2 max connections per server.
max_connection_per_server = 16
# Default: "1M". aria2 minimum split size.
min_split_size = "1M"
# Default: true. Keep aria2 resume support enabled.
resume_download = true

[build]
# Optional for render. Required by host build when no CLI -t/--tag is supplied.
tags = ["my-comfy:dev", "registry.example.com/my-comfy:dev"]
# Default: "load". Supported: "load", "push".
output = "load"
# v0.5 accepts exactly this ordered target list.
platforms = ["linux/amd64"]

[comfyui]
# Required. Supported: "latest", "nightly", semver, v-prefixed semver, or
# PEP 440-style constraints such as ">=0.3.0,<0.4.0" where accepted upstream.
version = "0.4.0"
# Default: "latest". Supported: "latest", a public PEP 440 comfy-cli version,
# or PEP 440-style constraints such as ">=1.4.0,<2.0.0".
cli_version = "1.5.3"
# Default: true. Must be true when custom_nodes are configured.
install_manager = true
# Default: "0.0.0.0". cdh owns the final ComfyUI --listen argument.
listen = "0.0.0.0"
# Default: 8188. cdh owns the final ComfyUI --port argument.
port = 8188
# Default: []. Additional ComfyUI CLI arguments appended after cdh-owned
# startup flags. Do not include --listen, --port, --auto-launch, or
# --disable-auto-launch here.
extra_args = []

[[comfyui.custom_nodes]]
# Registry custom node installed with ComfyUI-Manager.
type = "registry"
# Required for registry nodes. Registry IDs must be unique in this file.
id = "comfyui-custom-scripts"
# Default: unset. Use "latest", a registry-supported version selector, or
# PEP 440-style constraints such as ">=1.0.0,<2.0.0" where applicable.
version = "latest"
# Hook paths are relative to --scripts-dir, must not contain "..", and must end
# in .sh or .py. Shell hooks run with bash; Python hooks run with the venv Python.
pre_install_scripts = ["pre.sh"]
post_install_scripts = []

[[comfyui.custom_nodes]]
# Git custom node cloned directly into ComfyUI/custom_nodes.
type = "git"
# Required for git nodes. Git URLs must be unique in this file.
url = "https://github.com/pythongosssss/ComfyUI-Custom-Scripts.git"
# Default: unset. Branch, tag, or commit checked out after clone when provided.
ref = "main"
# Default: inferred from the URL basename with a trailing .git stripped.
# Must be a single safe directory name under ComfyUI/custom_nodes.
target_dir = "ComfyUI-Custom-Scripts"
pre_install_scripts = []
post_install_scripts = ["post.sh"]

[[files]]
# Required. Must be an HTTP(S) URL with a host.
url = "https://raw.githubusercontent.com/comfyanonymous/ComfyUI/master/README.md"
# Required. Relative to COMFYUI_PATH; absolute paths and ".." are rejected.
dir = "models/example-docs"
# Required. Must be a single filename component.
filename = "comfyui-readme-aria2.md"
# Default: false. Existing targets are skipped unless true.
overwrite = false
# Default: cdh.default_downloader. Supported: "aria2", "httpx".
downloader = "aria2"
# Default: cdh.default_download_mode. Supported: "sync", "async".
download_mode = "sync"

[[files]]
url = "https://raw.githubusercontent.com/comfyanonymous/ComfyUI/master/README.md"
dir = "models/example-docs"
filename = "comfyui-readme-httpx.md"
overwrite = true
downloader = "httpx"
download_mode = "sync"
